<section class="entity-list">
<h2 class="entity-list__title"><%= it.entities.length %> entities</h2>
<% if (it.entities.length === 0) { %>
<p class="empty-state">No entities yet.</p>
<% } else { %>
<ul class="entity-list__items">
<% it.entities.forEach((entity) => { %><%~ include("./entity-row", { entity }) %><% }) %>
</ul>
<% } %>
</section>
