<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>memory kg</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/htmx.min.js"></script>
  </head>
  <body class="app" hx-target="#node" hx-swap="innerHTML">
    <header class="app__header">
      <h1 class="app__title">memory kg</h1>
      <form class="controls" hx-get="/search" hx-target="#index" hx-swap="innerHTML" hx-trigger="submit, keyup changed delay:300ms">
        <input class="field" type="search" name="q" placeholder="search" autocomplete="off" />
      </form>
      <form class="controls" hx-post="/entities">
        <input class="field" name="name" placeholder="name" autocomplete="off" />
        <input class="field" name="entityType" placeholder="entity type" autocomplete="off" />
        <button class="button" type="submit">create</button>
      </form>
    </header>
    <div class="app__layout">
      <nav id="index" class="app__pane" hx-get="/entities" hx-trigger="load, graph-changed from:body" hx-target="this" hx-swap="innerHTML"></nav>
      <main id="node" class="app__pane" hx-on::after-swap="this.scrollTop = 0">
        <p class="empty-state">Select an entity or search to begin.</p>
      </main>
    </div>
  </body>
</html>
